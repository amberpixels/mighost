name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb

  test:
    runs-on: ubuntu-latest
    name: "test (ruby ${{ matrix.ruby }}, rails ${{ matrix.rails }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ruby: "3.1", rails: "~> 7.1.0"}
          - {ruby: "3.2", rails: "~> 7.2.0"}
          - {ruby: "3.3", rails: "~> 8.0.0"}
          - {ruby: "3.4", rails: "~> 8.1"}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: rails-${{ matrix.rails }}
      - run: bundle exec rspec
